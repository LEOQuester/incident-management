{% extends "base_app.html" %}
{% block content %}
<div class="toolbar">
  <a href="{% url 'portal:permission_create' %}" class="btn btn-primary">New Permission</a>
</div>
<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr>
        <th>Codename</th>
        <th>Name</th>
        <th>URL name</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for perm in permissions %}
      <tr>
        <td><code>{{ perm.codename }}</code></td>
        <td>{{ perm.name }}</td>
        <td>{{ perm.url_name|default:"—" }}</td>
        <td class="actions">
          <a href="{% url 'portal:permission_edit' perm.pk %}">Edit</a>
          <a href="{% url 'portal:permission_delete' perm.pk %}" class="danger">Delete</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="5">No permissions yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
