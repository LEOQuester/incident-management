{% extends "base_app.html" %}
{% block content %}
<form method="post" class="card form-card" id="user-form">
  {% csrf_token %}
  {% for field in form %}
  <div class="form-group">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="help-text">{{ field.help_text }}</small>{% endif %}
    {{ field.errors }}
  </div>
  {% endfor %}
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'portal:user_list' %}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('user-form')?.addEventListener('submit', function () {
  window.fmscSyncPhoneInputs(this);
});
</script>
{% endblock %}
